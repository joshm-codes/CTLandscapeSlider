<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecticut Landscapes</title>

    <link href = "style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Connecticut Landscapes</h1>
    <div id="landscapes">
        <ul id="slide">
            <li>
                <img src = "CTLandscapes/CTStateCapitol.jpg" alt ="CT State Capitol Building">
                <p>Connecticut State Capitol Building in Hartford, CT</p>
            </li> 
            <li>   
                <img src= "CTLandscapes/fivemilelighthouse.jpg" alt="Connecticut Lighthouse">
                <p>Five MIle Light House in New Haven, CT</p>
            </li>    
            <li>    
                <img src= "CTLandscapes/GilletteCastle.jpg" alt ="Gillette Castle">
                <p>Gillette Castle in East Haddam, CT</p>
            </li> 
            <li>   
                <img src = "CTLandscapes/MarkTwainHouse.webp" alt = "Mark Twain House">
                <p>Mark Twain's House in Hartford, CT</p>
            </li>
            <li>
                <img src = "CTLandscapes/SavilleDam.webp" alt="Saville Dam">
                <p>Saville Dam in Barkhamsted, CT</p>
            </li>
        </ul>
    </div>
    <div id="controls">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
    </div>
</body>
</html>
